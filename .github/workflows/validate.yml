name: validate
on: [push, pull_request]
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # pre-built binary packages: fast, no compiling
      - name: System libraries (PDF reading)
        run: sudo apt-get update && sudo apt-get install -y libpoppler-cpp-dev
      - name: Install packages
        run: Rscript -e 'install.packages(c("readxl", "testthat", "ggplot2", "officer", "htmltools", "jsonlite", "haven", "pdftools", "writexl", "xml2"))'
      - name: Run validation suite
        run: Rscript validation/run_validation.R
      - name: Run end-to-end example
        run: Rscript examples/run_example.R
